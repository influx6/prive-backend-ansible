- stat:
    path: "/home/{{user}}/apache-tomcat-{{tomcat_version}}"
  register: tomcat_dir
- name: Create tmp directory
  file:
    path: ./tmp
    owner: "{{user}}"
    mode: "0777"
    state: directory
- name: Download latest tomcat version
  get_url:
    url: "https://apache.website-solution.net/tomcat/tomcat-7/v{{tomcat_version}}/bin/apache-tomcat-{{tomcat_version}}.tar.gz"
    dest: "./tmp/apache-tomcat-{{tomcat_version}}.tar.gz"
    mode: "0777"
  when: tomcat_dir.stat.isdir is not defined
- name: Extract tomcat into directory
  register: untartask
  unarchive:
    src: "./tmp/apache-tomcat-{{tomcat_version}}.tar.gz"
    dest: "/home/{{user}}/"
    remote_src: yes
    owner: "{{user}}"
    mode: "0777"
  when: tomcat_dir.stat.isdir is not defined
  ignore_errors: yes
- debug:
    msg: "{{untartask}}"
- name: Extract tomcat using tar directly with shell
  shell: "{{ item }}"
  loop:
    - "tar -xzf ./tmp/apache-tomcat-{{tomcat_version}}.tar.gz"
    - "mv apache-tomcat-{{tomcat_version}} /home/{{user}}/apache-tomcat-{{tomcat_version}}"
    - "chmod -R 0777 /home/{{user}}/apache-tomcat-{{tomcat_version}}"
  when:
    - tomcat_dir.stat.isdir is not defined
    - untartask.failed is defined
- name: Add source lines into bashrc
  lineinfile:
    dest: "/home/{{user}}/.bashrc"
    line: "PATH=/home/{{user}}/apache-tomcat-{{tomcat_version}}/bin:$PATH"
- name: Add source lines into profile
  lineinfile:
    dest: "/home/{{user}}/.profile"
    line: "PATH=/home/{{user}}/apache-tomcat-{{tomcat_version}}/bin:$PATH"
